name: 08 - Using Variables

on:
  push:
  workflow_dispatch:

env:
  GLOBAL_VAR: "This is a global-level var"
  OVERWRITE_VAR: "This is an overwritten global-level var"

jobs:
  echo:
    runs-on: ubuntu-latest
    env:
      JOB_VAR: "This is a job-level var"
      OVERWRITE_VAR: "This is an overwritten job-level var"

    steps:
      - name: Prit a ENV VAR
        env:
          STEP_VAR: "This is a var"
          step_var2: "Another var placed here"
        run: |
          echo "Step env var: -> ${{ env.STEP_VAR }}"
          echo "Step env var 2: -> $env.step_var2 "
          echo "Job env var: -> ${{ env.JOB_VAR }}"
          echo "Global env var: -> ${{ env.GLOBAL_VAR }}"
          echo "Overwritten env var: -> ${{ env.OVERWRITE_VAR }}"

      - name: Print Overwritten Env Var
        env:
          OVERWRITE_VAR: "This is an overwritten step-level var"
        run: |
          echo "Overwritten env var: -> ${{ env.OVERWRITE_VAR }}"
