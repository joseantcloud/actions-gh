name: 18-2 Reusable Workflows

on:
    workflow_dispatch:

jobs:
    deploy:
      uses: ./.github/workflows/18-1-reusable-workflows.yaml
      with:
        target-directory: "dummy-dir"
    print-outputs:
        runs-on: ubuntu-latest
        needs: deploy
        steps:
          - name: Print outputs
            env:
              BUILD_STATUS: ${{ needs.deploy.outputs.build-status }}
              DEPLOY_URL: ${{ needs.deploy.outputs.url }}
              TARGET_DIRECTORY: ${{ needs.deploy.outputs.target-directory }}
            run: |
              echo "Build status: $BUILD_STATUS"
              echo "URL: $DEPLOY_URL"
              echo "Target directory: $TARGET_DIRECTORY"
