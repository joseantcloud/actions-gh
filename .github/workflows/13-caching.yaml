name: 13 - Caching

on:
  workflow_dispatch:
    inputs:
      use-cache:
        description: "Whether to use caching"
        type: boolean
        default: true
      node-version:
        description: "Node.js version to use"
        type: choice
        options:
          - "22.x"
          - "24.x"
        default: "24.x"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 13-caching/my-app
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install dependencies
        run: npm ci
      - name: Testing
        run: npm run test
      - name: Build
        run: npm run build
      - name: Deploy to non-production environment
        run: echo "Deploying to non-production environment"
