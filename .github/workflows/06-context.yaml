name: 06- context
run-name: 06 - context | DEBUG - ${{ inputs.debug }}

on:
  push:
  workflow_dispatch:
    inputs:
      debug:
        description: 'Enable debug mode'
        type: boolean
        required: true
        

jobs:
  echo-data:
    runs-on: ubuntu-latest
    steps:
      - name: Display information
        run: |
          echo "Displaying context information ${{github.event_name}}"
          echo "Repository: ${{github.repository}}"
          echo "Actor: ${{github.actor}}"
          echo "Ref: ${{github.ref}}"
          echo "SHA: ${{github.sha}}"
          echo "Run: ${{github.run_id}}"

      - name:  environment variables
        run: |
          echo "Environment variable value: ${{ vars.MY_VARIABLE }}"

    
