name: 15 Matrices Workflow

on:
    workflow_dispatch:


jobs:
    backward-compatibility:
        name: ${{ matrix.os }} - Node.js ${{ matrix.node-version }}
        runs-on: ${{ matrix.os }}
        strategy:
            fail-fast: true
            matrix:
                node-version: [20.x, 22.x, 24.x]
                os:
                    - ubuntu-latest
                    - windows-latest
                include:
                    - os: ubuntu-latest
                      node-version: 21.x
                    - os: windows-latest
                      node-version: 21.x
                      tag: experimental

        steps:
            - name: Setup node
              uses: actions/setup-node@v3
              with: 
                node-version: ${{ matrix.node-version }}
            - name: Fail if experimental tag is ON
              if: ${{ matrix.tag == 'experimental' }}
              run: exit 1
            
            - name: Perform tests
              run: |
               echo "Running tests on OS ${{ matrix.os }} and Node.js ${{ matrix.node-version }}"
               sleep 10
            - name: Upload test results
              run: echo "Uploading test results for OS ${{ matrix.os }} and Node.js ${{ matrix.node-version }}"

    include-example:
        name: ${{ matrix.color }} - ${{ matrix.shape }} - ${{ matrix.size }} - ${{ matrix.opacity }}
        runs-on: ubuntu-latest
        strategy:
            matrix:
                color: [red, green]
                shape: [circle, square]
                size: [small, medium]
                include:
                    - opacity: 0.5
                    - color: red
                      shape: circle
                exclude:
                    - opacity: 0.5
        steps:
            - name: Dummy step
              run: echo "Running dummy step for color ${{ matrix.color }}, shape ${{ matrix.shape }}, size ${{ matrix.size }}, opacity ${{ matrix.opacity }}"
            
                      


             
        