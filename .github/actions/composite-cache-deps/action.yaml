name: Cache Node and NPM dependencies

description: Caches Node and NPM dependencies to speed up workflow runs

inputs:
  node-version:
    description: "Node.js version to use"
    default: "22.x"
    required: true
  working-dir:
    description: "Working directory for the Node project"
    default: "."
    required: true
runs:
  using: "composite"
  steps:
    - name: Setups NodeJs version ${{ inputs.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ inputs.node-version }}
    - name: Cache Node and NPM dependencies
      uses: actions/cache@v3
      with:
        path: ${{ inputs.working-dir }}/node_modules
        key: node-modules-${{ hashFiles('${{ inputs.working-dir }}/package-lock.json') }}
    - name: Install Node dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-dir }}
