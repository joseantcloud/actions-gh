
name: JS Dependency Update
description: Updates JavaScript dependencies using a custom action


inputs:
  base-branch:
    description: "The base branch to compare against"
    default: "main"
    required: false
  target-branch:
    description: "The target branch to merge into"
    default: update-dependencies
    required: false
  working-directory:
    description: "The directory to run the action in"
    required: true
  gh-token:
    description: "The GitHub token to use"
    required: true
  debug:
    description: "Enable debug logging"
    default: "false"


runs:
  using: "node24"
  main: "index.js"



